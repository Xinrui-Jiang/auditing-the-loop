[project]
name = "loopauditor"
version = "0.1.0"
description = "LoopAuditor: a verification loop for video generation"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13",
  "jiwer>=3.0",
  "mlx-whisper>=0.4",
]

[project.scripts]
loopauditor = "loopauditor.cli:app"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loopauditor"]
